name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Настраиваем Java (требуется для сборки Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Устанавливаем Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Скачиваем зависимости
      - name: Install dependencies
        run: flutter pub get

      # 5. Собираем APK в релизном режиме (без подписи ключом, но готовый для установки)
      - name: Build APK
        run: flutter build apk --split-per-abi --no-codesign

      # 6. Сохраняем собранные APK в Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: build/app/outputs/flutter-apk/*.apk
